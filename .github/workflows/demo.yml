# The demo on GitHub Pages: the site's own client (Manx-forge/manx-corpus-search, branch speech) with
# demo/speech-api.js answering its speech API from the index scripts/demo.py builds. Rerun by hand after a site change.
name: demo
on:
  push:
    branches: [main]
    paths: [OpenData/**, demo/**, scripts/demo.py, .github/workflows/demo.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: Manx-forge/manx-corpus-search
          ref: speech
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npx vite build --base=/manx-speech-corpus/
        working-directory: site/CorpusSearch/ClientApp
      - run: python scripts/demo.py _site site/CorpusSearch/ClientApp/build /manx-speech-corpus/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
